<template>
    <lightning-input-rich-text
        label={label}
        label-visible={computedLabelVisible}
        field-level-help={fieldLevelHelp}
        value={_displayValue}
        formats={formats}
        message-when-bad-input={_helpMessage}
        valid={_noErrors}
        disabled={disabled}
        disabled-categories={disabledCategories}
        custom-buttons={customButtons}

</template>
