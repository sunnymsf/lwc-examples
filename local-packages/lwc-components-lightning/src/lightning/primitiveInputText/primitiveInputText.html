<template>
  <div part="input-text">
    <div part="label-container">
      <slot name="label-start"></slot>
      <label part="label" for={id}>
        <slot name="label" onslotchange={handleLabelSlotChange}></slot>
      </label>
      <slot name="label-end"></slot>
    </div>
    <div part="input-container" onclick={handleClick}>
      <slot name="start"></slot>
      <input
        part="input"
        id={id}
        role={role}
        disabled={disabled}
        readonly={readOnly}
        required={required}
        placeholder={placeholder}
        pattern={pattern}
        type={type}
        value={value}
        name={name}
        form={form}
        minlength={minLength}
        maxlength={maxLength}
        aria-invalid={ariaInvalid}
        oninput={handleInput}
        onblur={handleBlur}
      />
      <slot name="end"></slot>
    </div>
  </div>
  <div part="help-text">
    <slot name="help-text" onslotchange={handleHelpTextSlotChange}></slot>
  </div>
</template>
