<template>
  <div part="input-range">
    <div part="label-container">
      <slot name="label-start"></slot>
      <label part="label" for={id}>
        <slot name="label" onslotchange={handleLabelSlotChange}></slot>
      </label>
      <slot name="label-end"></slot>
    </div>
    <div part="input-container" onclick={handleClick}>
      <slot name="start"></slot>
      <input
        part="input"
        type="range"
        id={id}
        role="slider"
        disabled={disabled}
        value={value}
        name={name}
        form={form}
        min={min}
        max={max}
        step={step}
        aria-invalid={ariaInvalid}
        oninput={handleInput}
        onblur={handleBlur}
      />
      <slot name="end"></slot>
    </div>
  </div>
  <div part="help-text">
    <slot name="help-text" onslotchange={handleHelpTextSlotChange}></slot>
  </div>
</template>
