<template>
  <div part="input-counter">
    <div part="label-container">
      <slot name="label-start"></slot>
      <label part="label" for={id}>
        <slot name="label" onslotchange={handleLabelSlotChange}></slot>
      </label>
      <slot name="label-end"></slot>
    </div>
    <div part="input-container" onclick={handleClick}>
      <slot name="start">
      </slot>
      <input
        part="input"
        type="number"
        id={id}
        role={role}
        disabled={disabled}
        readonly={readOnly}
        required={required}
        placeholder={placeholder}
        value={value}
        name={name}
        form={form}
        min={min}
        max={max}
        step={step}
        aria-invalid={ariaInvalid}
        oninput={handleInput}
        onblur={handleBlur}
      />
      <template lwc:if={readOnly}></template>
      <template lwc:else>
        <button part="step step-down" aria-label={stepDownLabel} onclick={handleStepDown} disabled={disabled}>
          <slot name="step-down">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 52 52" id="down"><path d="M8.3 14h35.4c1 0 1.7 1.3.9 2.2L27.3 37.4c-.6.8-1.9.8-2.5 0L7.3 16.2c-.7-.9-.1-2.2 1-2.2z"></path></svg>
          </slot>
        </button>
        <button part="step step-up" aria-label={stepUpLabel} onclick={handleStepUp} disabled={disabled}>
          <slot name="step-up">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 52 52" id="up"><path d="M43.7 38H8.3c-1 0-1.7-1.3-.9-2.2l17.3-21.2c.6-.8 1.9-.8 2.5 0l17.5 21.2c.7.9.1 2.2-1 2.2z"></path></svg>
          </slot>
        </button>
      </template>
      <slot name="end">
      </slot>
    </div>
  </div>
  <div part="help-text">
    <slot name="help-text" onslotchange={handleHelpTextSlotChange}></slot>
  </div>
</template>
